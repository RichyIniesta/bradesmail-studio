<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BradesMail Studio | Generador de Correos</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; font-family: Arial, Helvetica, sans-serif; }
body { display: flex; flex-direction: column; background: #f4f4f4; }
header { height: 60px; background: #CC092F; display: flex; align-items: center; padding: 0 24px; }
header a { color: #fff; text-decoration: none; font-weight: bold; }
main { flex: 1; display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
.controls { background: #fff; border-right: 1px solid #ddd; padding: 24px; }
.controls h1 { margin: 0 0 8px; font-size: 20px; }
.controls p { margin: 0 0 24px; color: #666; line-height: 1.5; }
label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: bold; }
select { width: 100%; padding: 10px; font-size: 14px; }
.actions { margin-top: 24px; display: flex; gap: 8px; flex-direction: column; }
button { padding: 10px 14px; border: 1px solid #ccc; background: #fff; cursor: pointer; font-size: 14px; }
button.primary { background: #CC092F; border-color: #CC092F; color: #fff; }
.preview { min-width: 0; display: flex; flex-direction: column; }
.preview-bar { height: 50px; background: #fff; border-bottom: 1px solid #ddd; display: flex; align-items: center; padding: 0 16px; }
.preview-bar strong { font-size: 14px; }
.frame-wrap { flex: 1; min-height: 0; }
iframe { width: 100%; height: 100%; border: 0; display: block; }
@media (max-width: 800px) {
  main { grid-template-columns: 1fr; }
  .controls { border-right: 0; border-bottom: 1px solid #ddd; }
  .preview { min-height: 500px; }
}
</style>
</head>
<body>
<header><a href="index.html">BradesMail Studio</a></header>
<main>
<section class="controls">
<h1>Generador de correos</h1>
<p>Selecciona el encabezado que quieres utilizar.</p>
<label for="header-select">Encabezado</label>
<select id="header-select">
<option value="informa">Bradesco Informa</option>
<option value="talento">Talento</option>
</select>
<div class="actions">
<button type="button" class="primary" id="copy-html">Copiar HTML</button>
<button type="button" id="download-html">Descargar HTML</button>
</div>
</section>
<section class="preview">
<div class="preview-bar"><strong>Vista previa</strong></div>
<div class="frame-wrap"><iframe id="preview-frame" title="Vista previa del correo"></iframe></div>
</section>
</main>
<script>
const HEADER_PRESETS = {
  informa: "https://github.com/RichyIniesta/app-comunicacion/blob/main/bradesco-informa-plantilla-1-1.png?raw=true",
  talento: "https://github.com/RichyIniesta/app-comunicacion/blob/2c748b4cb507990cbb4631dc37b53963b1576bd2/bradesco-informa-plantilla-1-2.png?raw=true"
};
let rawTemplate = "";
async function loadTemplate() {
  const response = await fetch("plantilla.html");
  if (!response.ok) throw new Error("No se pudo cargar plantilla.html");
  rawTemplate = await response.text();
  updatePreview();
}
function buildHTML() {
  if (!rawTemplate) return "";
  const header = document.getElementById("header-select").value;
  const imageUrl = HEADER_PRESETS[header];
  const alt = header === "informa" ? "Bradesco Informa" : "Talento";
  const headerBlock = `
<tr>
<td align="center" width="600" style="margin: 0; padding: 0; line-height: 0;">
<img src="${imageUrl}" width="600" style="display: block; width: 100%; max-width: 600px; height: auto; border: 0;" alt="${alt}">
</td>
</tr>
`;
  return rawTemplate.replace("{{BLOQUES_CONTENIDO}}", headerBlock);
}
function updatePreview() {
  const iframe = document.getElementById("preview-frame");
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write(buildHTML());
  doc.close();
}
async function copyHTML() {
  try {
    await navigator.clipboard.writeText(buildHTML());
    alert("HTML copiado al portapapeles.");
  } catch (error) {
    console.error(error);
    alert("No fue posible copiar el HTML.");
  }
}
function downloadHTML() {
  const blob = new Blob([buildHTML()], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "correo-bradesco.html";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}
document.getElementById("header-select").addEventListener("change", updatePreview);
document.getElementById("copy-html").addEventListener("click", copyHTML);
document.getElementById("download-html").addEventListener("click", downloadHTML);
loadTemplate().catch(error => {
  console.error(error);
  alert("No se pudo cargar la plantilla base. Abre la aplicación desde un servidor web.");
});
</script>
</body>
</html>
