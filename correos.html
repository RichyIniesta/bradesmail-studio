<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BradesMail Studio | Generador de Correos</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; font-family: Arial, Helvetica, sans-serif; }
body { display: flex; flex-direction: column; background: #f4f4f4; }
header { height: 60px; background: #CC092F; display: flex; align-items: center; padding: 0 24px; }
header a { color: #fff; text-decoration: none; font-weight: bold; }

main { flex: 1; min-height: 0; display: flex; }
.controls {
  width: 240px;
  flex: 0 0 240px;
  position: relative;
  background: #fff;
  border-right: 1px solid #ddd;
  padding: 20px;
}
.controls h1 { margin: 0 0 16px; font-size: 18px; }
.header-picker { position: relative; }
.header-button {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 12px;
  border: 1px solid #d5d5d5;
  border-radius: 6px;
  background: #fff;
  text-align: left;
}
.header-button span { font-size: 14px; }
.header-button .arrow { font-size: 12px; color: #777; }
.header-menu {
  position: absolute;
  z-index: 20;
  top: calc(100% + 8px);
  left: 0;
  width: 220px;
  padding: 6px;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,.12);
  display: none;
}
.header-menu.open { display: block; }
.header-option {
  width: 100%;
  padding: 10px 11px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  text-align: left;
  cursor: pointer;
  font-size: 14px;
}
.header-option:hover { background: #f5f5f5; }
.header-option.selected {
  background: #f7f7f7;
  font-weight: bold;
}
.actions {
  margin-top: 24px;
  display: flex;
  gap: 8px;
  flex-direction: column;
}
button { padding: 10px 14px; border: 1px solid #ccc; background: #fff; cursor: pointer; font-size: 14px; }
button.primary { background: #CC092F; border-color: #CC092F; color: #fff; }

.preview { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.preview-bar {
  height: 50px;
  background: #fff;
  border-bottom: 1px solid #ddd;
  display: flex;
  align-items: center;
  padding: 0 16px;
}
.preview-bar strong { font-size: 14px; }
.frame-wrap { flex: 1; min-height: 0; }
iframe { width: 100%; height: 100%; border: 0; display: block; }

@media (max-width: 800px) {
  main { flex-direction: column; }
  .controls {
    width: 100%;
    flex-basis: auto;
    border-right: 0;
    border-bottom: 1px solid #ddd;
  }
}
</style>
</head>
<body>
<header><a href="index.html">BradesMail Studio</a></header>

<main>
<section class="controls">
  <h1>Encabezado</h1>

  <div class="header-picker">
    <button type="button" class="header-button" id="header-button" aria-expanded="false" aria-haspopup="true">
      <span id="header-button-label">Bradesco Informa</span>
      <span class="arrow">⌄</span>
    </button>

    <div class="header-menu" id="header-menu" role="menu">
      <button type="button" class="header-option selected" data-channel="informa" role="menuitem">
        Bradesco Informa
      </button>
      <button type="button" class="header-option" data-channel="talento" role="menuitem">
        Talento
      </button>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="primary" id="copy-html">Copiar HTML</button>
    <button type="button" id="download-html">Descargar HTML</button>
  </div>
</section>

<section class="preview">
  <div class="preview-bar"><strong>Vista previa</strong></div>
  <div class="frame-wrap"><iframe id="preview-frame" title="Vista previa del correo"></iframe></div>
</section>
</main>

<script>
const HEADER_PRESETS = {
  informa: "https://github.com/RichyIniesta/app-comunicacion/blob/main/bradesco-informa-plantilla-1-1.png?raw=true",
  talento: "https://github.com/RichyIniesta/app-comunicacion/blob/2c748b4cb507990cbb4631dc37b53963b1576bd2/bradesco-informa-plantilla-1-2.png?raw=true"
};

let rawTemplate = "";
let selectedChannel = "informa";

async function loadTemplate() {
  const response = await fetch("plantilla.html");
  if (!response.ok) throw new Error("No se pudo cargar plantilla.html");
  rawTemplate = await response.text();
  updatePreview();
}

function buildHTML() {
  if (!rawTemplate) return "";

  const imageUrl = HEADER_PRESETS[selectedChannel];
  const alt = selectedChannel === "informa" ? "Bradesco Informa" : "Talento";

  const headerBlock = `
<tr>
<td align="center" width="600" style="margin: 0; padding: 0; line-height: 0;">
<img src="${imageUrl}" width="600" style="display: block; width: 100%; max-width: 600px; height: auto; border: 0;" alt="${alt}">
</td>
</tr>
`;

  return rawTemplate.replace("{{BLOQUES_CONTENIDO}}", headerBlock);
}

function updatePreview() {
  const iframe = document.getElementById("preview-frame");
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write(buildHTML());
  doc.close();
}

async function copyHTML() {
  try {
    await navigator.clipboard.writeText(buildHTML());
    alert("HTML copiado al portapapeles.");
  } catch (error) {
    console.error(error);
    alert("No fue posible copiar el HTML.");
  }
}

function downloadHTML() {
  const blob = new Blob([buildHTML()], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "correo-bradesco.html";

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

const headerButton = document.getElementById("header-button");
const headerButtonLabel = document.getElementById("header-button-label");
const headerMenu = document.getElementById("header-menu");
const headerOptions = document.querySelectorAll(".header-option");

function selectChannel(channel) {
  selectedChannel = channel;

  const label = channel === "informa" ? "Bradesco Informa" : "Talento";
  headerButtonLabel.textContent = label;

  headerOptions.forEach(option => {
    option.classList.toggle("selected", option.dataset.channel === channel);
  });

  updatePreview();
}

headerButton.addEventListener("click", () => {
  const isOpen = headerMenu.classList.toggle("open");
  headerButton.setAttribute("aria-expanded", String(isOpen));
});

headerOptions.forEach(option => {
  option.addEventListener("click", () => {
    selectChannel(option.dataset.channel);
    headerMenu.classList.remove("open");
    headerButton.setAttribute("aria-expanded", "false");
  });
});

document.addEventListener("click", event => {
  if (!event.target.closest(".header-picker")) {
    headerMenu.classList.remove("open");
    headerButton.setAttribute("aria-expanded", "false");
  }
});

document.getElementById("copy-html").addEventListener("click", copyHTML);
document.getElementById("download-html").addEventListener("click", downloadHTML);

loadTemplate().catch(error => {
  console.error(error);
  alert("No se pudo cargar la plantilla base. Abre la aplicación desde un servidor web.");
});
</script>
</body>
</html>
