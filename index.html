<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BradesMail Studio</title>
</head>
<body>
<main>
  <h1>BradesMail Studio</h1>
  <p>¿Qué quieres hacer?</p>

  <div>
    <button type="button" id="new-email">Iniciar nuevo correo</button>
    <button type="button" id="import-html">Importar HTML</button>
    <input type="file" id="html-file" accept=".html,.htm,text/html" hidden>
  </div>

  <p id="import-status" aria-live="polite"></p>
</main>

<script>
const newEmailButton = document.getElementById('new-email');
const importButton = document.getElementById('import-html');
const fileInput = document.getElementById('html-file');
const status = document.getElementById('import-status');

newEmailButton.addEventListener('click', () => {
  window.location.href = 'correos.html';
});

importButton.addEventListener('click', () => {
  fileInput.click();
});

fileInput.addEventListener('change', async (event) => {
  const file = event.target.files[0];
  if (!file) return;

  if (!file.name.toLowerCase().endsWith('.html') && !file.name.toLowerCase().endsWith('.htm')) {
    status.textContent = 'Selecciona un archivo HTML válido.';
    return;
  }

  try {
    const html = await file.text();
    sessionStorage.setItem('bradesmail:imported-html', html);
    sessionStorage.setItem('bradesmail:imported-name', file.name);
    window.location.href = 'correos.html?mode=import';
  } catch (error) {
    console.error(error);
    status.textContent = 'No fue posible importar el archivo.';
  }
});
</script>
</body>
</html>
